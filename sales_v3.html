<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --blue: #005195;
      --blue-dark: #003b70;
      --blue-light: #C4DAEC;
      --bg: #f3f6fa;
      --card: #ffffff;
      --border: #d6e0ea;
      --text: #0f172a;
      --muted: #64748b;
      --green: #8ec6b0;
      --green-dark: #21835f;
      --red: #d0342c;
      --grey-line: #8a99aa;
      --non-nev: #c8deef;
      --nev: #005195;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 18px 22px 28px;
    }

    .top-nav {
      display: flex;
      gap: 18px;
      align-items: center;
      background: linear-gradient(90deg, #003b70, #005195);
      color: white;
      padding: 13px 18px;
      border-radius: 0 0 16px 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .top-nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      opacity: 0.9;
    }

    .top-nav a.active {
      opacity: 1;
      border-bottom: 2px solid white;
      padding-bottom: 3px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 14px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      color: var(--blue-dark);
    }

    .header .subtitle {
      margin-top: 5px;
      font-size: 13px;
      color: var(--muted);
    }

    .header-right {
      text-align: right;
      font-size: 12px;
      color: var(--muted);
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(8, minmax(120px, 1fr)) auto;
      gap: 10px;
      margin-bottom: 16px;
      align-items: end;
    }

    .filter-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 10px;
    }

    .filter-box label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .filter-box select {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13px;
      color: var(--text);
    }

    .reset-btn {
      height: 42px;
      border: 1px solid var(--blue);
      background: white;
      color: var(--blue);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 0 16px;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 14px 16px;
      min-height: 88px;
    }

    .kpi-value {
      font-size: 27px;
      font-weight: 800;
      color: var(--blue);
      line-height: 1.05;
    }

    .kpi-title {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-top: 7px;
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .card h2 {
      margin: 0;
      font-size: 17px;
      color: #000;
    }

    .chart-note-top {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      max-width: 280px;
    }

    .chart-box {
      height: 300px;
      position: relative;
    }

    .chart-box.large {
      height: 330px;
    }

    .note-strip {
      margin-top: 10px;
      background: #f7fafc;
      border: 1px solid #edf2f7;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .rank-list {
      margin-top: 8px;
      display: grid;
      gap: 9px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 28px 150px 1fr 70px;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }

    .rank-bar-bg {
      height: 7px;
      background: #edf2f7;
      border-radius: 999px;
      overflow: hidden;
    }

    .rank-bar-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 999px;
    }

    .table-card {
      margin-bottom: 14px;
    }

    .table-scroll {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      max-height: 520px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
      background: white;
      font-size: 12px;
    }

    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid #edf2f7;
      white-space: nowrap;
      text-align: right;
    }

    th {
      position: sticky;
      top: 0;
      background: #f8fbff;
      color: var(--blue-dark);
      z-index: 1;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    th:first-child,
    td:first-child,
    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .notes-list {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.55;
    }

    .methodology {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
    }

    .positive { color: var(--green-dark); }
    .negative { color: var(--red); }

    @media (max-width: 1300px) {
      .filters { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 1000px) {
      .grid-2, .notes-grid { grid-template-columns: 1fr; }
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 700px) {
      .kpi-row { grid-template-columns: 1fr; }
      .filters { grid-template-columns: 1fr; }
      .header { flex-direction: column; }
      .header-right { text-align: left; }
    }
  </style>
</head>
