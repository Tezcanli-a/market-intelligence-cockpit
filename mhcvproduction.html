<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MHCV Production Forecast</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family:Segoe UI, Arial, sans-serif;
    margin:0;
    background:#f4f6f9;
}

header{
    background:#003366;
    color:white;
    padding:20px;
}

header h1{
    margin:0;
}

.content{
    padding:20px;
}

.kpis{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.kpi{
    background:white;
    padding:20px;
    border-radius:8px;
    min-width:180px;
    box-shadow:0 1px 4px rgba(0,0,0,0.1);
}

.chart-container{
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 1px 4px rgba(0,0,0,0.1);
}
</style>

</head>
<body>

<header>
    <h1>MHCV Production Forecast</h1>
</header>

<div class="content">

    <div class="kpis">
        <div class="kpi">Global Production Volume</div>
        <div class="kpi">CAGR 2026-2031</div>
        <div class="kpi">Truck %</div>
        <div class="kpi">Bus %</div>
    </div>

    <div class="chart-container">
        <canvas id="trendChart"></canvas>
    </div>

</div>

<script src="mhcvproduction.js"></script>

</body>
</html>
